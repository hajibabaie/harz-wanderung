[project]
name = "harzplan"
version = "0.1.0"
description = "Saturday day-trip planner for the Harzer Wandernadel (222 stamps)"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harzplan"]
