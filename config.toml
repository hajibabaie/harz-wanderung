# All settings for the Harz Saturday-trip planner. Code reads only this file.

[home]
name = "Clausthal-Zellerfeld"
lat = 51.8081
lon = 10.3358

[data]
# Official GPS download. Free for private personal use; do not redistribute.
gpx_url = "https://www.harzer-wandernadel.de/wp-content/uploads/2025/05/GPX-Daten-Stempelstellen-ZIP-Archiv-gepackt-Stand-23.04.2025.zip"
stamp_count = 222

[network]
# Bounding box = stamp extent + this buffer.
bbox_buffer_km = 2.0
# Warn when a stamp snaps to a network node farther than this.
snap_warn_m = 500
# Pairwise distances beyond this limit are stored as infinity.
pair_dist_limit_km = 30.0
# Copernicus GLO-30 DEM tiles (open data on AWS, no login).
dem_url_template = "https://copernicus-dem-30m.s3.amazonaws.com/Copernicus_DSM_COG_10_{tile}_DEM/Copernicus_DSM_COG_10_{tile}_DEM.tif"
# Overpass download tuning for the big walking-network fetch.
# Endpoints are tried in order; each one flips between healthy and
# overloaded within hours, so keep several here.
overpass_urls = [
    "https://overpass-api.de/api",
    "https://overpass.kumi.systems/api",
    "https://overpass.private.coffee/api",
]
overpass_query_km2 = 400
# Dead endpoints fail after the connect timeout; slow queries may read long.
overpass_connect_timeout_s = 15
overpass_timeout_s = 300
# When every endpoint fails, wait and try the whole list again.
overpass_retry_rounds = 20
overpass_retry_wait_s = 180

[trip]
# Hard floor: shorter loops get a detour until they reach it.
loop_km_min = 10.0
loop_km_max = 20.0
ascent_m_max = 600
stamps_min = 2
stamps_ideal_min = 3
stamps_ideal_max = 6
# Clustering keeps this much loop budget free for the walk to/from parking.
trailhead_reserve_km = 2.0

[route]
# Trailhead search: OSM parking spots within this straight-line distance
# of any stamp in the cluster; the best of the closest few wins.
parking_radius_km = 2.0
max_parking_candidates = 5

[osrm]
# Public OSRM demo server for home-to-trailhead drive times.
base_url = "https://router.project-osrm.org"
# The demo server caps table requests at ~100 locations.
chunk_size = 80

[time]
# Naismith walking-time rule with the Langmuir descent correction.
walk_speed_kmh = 5.0
climb_min_per_100m = 10.0
gentle_descent_min_per_300m = -10.0

[badges]
# Stamp counts that earn a Harzer Wandernadel badge.
thresholds = [[8, "Bronze"], [16, "Silber"], [24, "Gold"], [50, "Wanderkönig"], [111, "Wanderkaiser"], [222, "Harzer Steiger"]]

[outputs]
# The Folium map thins each loop to this many points (GPX keeps all).
map_points_per_trip = 300

[progress]
# Stamp numbers already collected. Later stages drop them from planning.
done = [137, 138, 139, 145, 128, 127]
